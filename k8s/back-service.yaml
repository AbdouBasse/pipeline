apiVersion: v1
kind: Service
metadata:
  name: back-service   # Nom du service exposant le backend
  labels:
    app: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"
spec:
  selector:
    app: backend          # Lie le service au pod ayant le label "app=backend"
  ports:
    - port: 5000            # Port d’accès au service à l’intérieur du cluster
      targetPort: 5000      # Port du conteneur dans le pod
  type: NodePort            # Type de service exposé
